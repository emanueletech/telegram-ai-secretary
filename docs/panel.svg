<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560">
<defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .b { fill: #2b3a4a; }
    .bl { font-size: 15px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
    .on { fill: #26a5e4; }
    .hl { animation: hl 6s infinite; }
    @keyframes hl { 0%, 40% { fill: #2b3a4a; } 45%, 60% { fill: #3d6b8f; } 65%, 100% { fill: #2b3a4a; } }
  </style>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#26a5e4" opacity=".10"/>
  </pattern>
</defs>

<rect width="720" height="560" rx="20" fill="#0e1621"/>
<rect width="720" height="560" rx="20" fill="url(#dots)"/>

<!-- owner's command -->
<rect x="590" y="22" width="108" height="38" rx="14" fill="#2b5278"/>
<text x="644" y="47" font-size="15" fill="#fff" text-anchor="middle">/menu</text>

<!-- bot message -->
<rect x="22" y="76" width="676" height="196" rx="16" fill="#182533"/>
<text x="42" y="108" font-size="16" font-weight="700" fill="#fff">🤖 Secretary — control panel</text>
<text x="42" y="140" font-size="15" fill="#c9d6e0">Mode: <tspan font-weight="700" fill="#fff">⏰ Automatic</tspan> (AI during the set hours, away message outside)</text>
<text x="42" y="166" font-size="15" fill="#c9d6e0">AI hours: <tspan font-weight="700" fill="#fff">09:00–19:00</tspan></text>
<text x="42" y="192" font-size="15" fill="#c9d6e0">Message forwarding: <tspan font-weight="700" fill="#fff">on</tspan></text>
<text x="42" y="218" font-size="15" fill="#c9d6e0">Business info: <tspan font-weight="700" fill="#fff">set (412 characters)</tspan></text>
<text x="42" y="252" font-size="15" fill="#c9d6e0">Pick an option 👇</text>

<!-- keyboard: 7 rows x 2 -->
<g transform="translate(22 282)">
  <rect class="b" x="0" y="0" width="334" height="32" rx="10"/><text class="bl" x="167" y="21">🤖 AI</text>
  <rect class="on" x="342" y="0" width="334" height="32" rx="10"/><text class="bl" x="509" y="21">✅ ⏰ Automatic</text>

  <rect class="b" x="0" y="38" width="334" height="32" rx="10"/><text class="bl" x="167" y="59">💤 Away</text>
  <rect class="b" x="342" y="38" width="334" height="32" rx="10"/><text class="bl" x="509" y="59">🔴 Off</text>

  <rect class="b" x="0" y="76" width="334" height="32" rx="10"/><text class="bl" x="167" y="97">📊 Stats</text>
  <rect class="b hl" x="342" y="76" width="334" height="32" rx="10"/><text class="bl" x="509" y="97">📨 Forwarding: ON</text>

  <rect class="b" x="0" y="114" width="334" height="32" rx="10"/><text class="bl" x="167" y="135">✍️ Away message</text>
  <rect class="b" x="342" y="114" width="334" height="32" rx="10"/><text class="bl" x="509" y="135">🧠 AI personality</text>

  <rect class="b" x="0" y="152" width="334" height="32" rx="10"/><text class="bl" x="167" y="173">📚 Business info</text>
  <rect class="b" x="342" y="152" width="334" height="32" rx="10"/><text class="bl" x="509" y="173">🕐 AI hours</text>

  <rect class="b" x="0" y="190" width="334" height="32" rx="10"/><text class="bl" x="167" y="211">▶️ Resume everywhere</text>
  <rect class="b" x="342" y="190" width="334" height="32" rx="10"/><text class="bl" x="509" y="211">🗑 Clear memory</text>

  <rect class="b" x="0" y="228" width="334" height="32" rx="10"/><text class="bl" x="167" y="249">📢 Send channel invite</text>
  <rect class="b" x="342" y="228" width="334" height="32" rx="10"/><text class="bl" x="509" y="249">♻️ Restore defaults</text>
</g>
</svg>
