# Build the Docker image and publish it to the GitHub Container Registry
# (ghcr.io/<owner>/<repo>), so people can pull a ready image instead of
# building it on their NAS. The package page on GitHub shows how many times it
# has been downloaded.
#
#   push to main        -> :latest and :sha-<short>
#   tag v1.2.3          -> :1.2.3, :1.2 and :latest
#   manual run          -> same as the branch or tag it runs on
name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # README or docs edits don't change the image: don't rebuild for them.
    paths:
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push supersedes a build still running for the same branch or tag.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # arm64 for ARM NAS boxes and Raspberry Pi-class servers. Every
      # dependency ships an aarch64 wheel, so emulation only unpacks wheels.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # Registry paths must be lowercase.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=telegram-ai-secretary
            org.opencontainers.image.description=AI auto-replies for your Telegram account

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
